# Research suite — runs on every change to the backend or the exports.
#
# Tuned for the GitLab free tier, which allows 400 compute minutes per month:
#
# - stdlib-only suite, so no service container, database or GPU image
# - only pytest is installed, not requirements.txt (which pulls torch/TensorRT)
# - the 2000-permutation battery is deselected with -m "not slow"
# - interruptible, so pushing twice does not pay for the superseded pipeline
# - rules:changes, so unrelated commits do not spend quota at all
#
# Run the full battery locally before a release or an audit:
#   cd backend && python -m pytest tests -v

stages:
  - test

research:suite:
  stage: test
  image: python:3.11-slim
  interruptible: true
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: research-pip
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --quiet --upgrade pip
    - python -m pip install --quiet pytest
  script:
    - cd backend
    - python -m pytest tests -v -m "not slow" --junitxml=../research-junit.xml
    - python -m research.report | tee ../research-report.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - research-report.txt
      - research-report.json
    reports:
      junit: research-junit.xml
  rules:
    - changes:
        - backend/**/*
        - eagle-eye-export-*.csv
        - .gitlab-ci.yml

# Full-fidelity battery: 2000 permutations, wider lookback and horizon.
# Manual so it never consumes quota unattended. Run before a release.
research:full:
  extends: research:suite
  script:
    - cd backend
    - python -m pytest tests -v --junitxml=../research-junit-full.xml
    - python -m research.report | tee ../research-report-full.txt
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - research-report-full.txt
      - research-report.json
    reports:
      junit: research-junit-full.xml
  rules:
    - when: manual
      allow_failure: true
