# Lean by necessity: the free tier allows 400 compute minutes/month, so this
# runs lint and test only. Anything heavier is `when: manual`.
#
# The same commands run locally via `make verify`, so a green local run means a
# green pipeline.

stages: [lint, test, research]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

# Run once per change, not twice: an MR pipeline OR a branch pipeline, never
# both. Duplicate pipelines are the fastest way to exhaust the free minutes.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

default:
  image: python:3.11-slim
  interruptible: true  # superseded pipelines cancel, saving minutes
  cache:
    key:
      files: [requirements-dev.txt]
    paths: [.cache/pip]
  before_script:
    - pip install -r requirements-dev.txt

lint:
  stage: lint
  script:
    - ruff check backend tools
    - ruff format --check backend tools

test:
  stage: test
  script:
    - pytest --cov --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml --cov-fail-under=40
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Manual: the permutation test re-runs the whole pipeline once per shuffle,
# which is minutes of CPU. Run it locally with `make research` instead and
# commit the resulting report.
research:
  stage: research
  when: manual
  allow_failure: true
  script:
    - test -f clean_data.csv || { echo "clean_data.csv not present"; exit 1; }
    - cd backend
    - python -m research.runner ../clean_data.csv --permutations 50 --json ../research-report.json
  artifacts:
    paths: [research-report.json]
    expire_in: 1 year
